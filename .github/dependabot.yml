version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    # The linter's canary (tools/lint) moves by hand.
    ignore:
      - dependency-name: bun
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
