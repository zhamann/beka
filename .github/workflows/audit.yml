name: Audit

# GitHub doesn't read bun.lock, so Dependabot alerts don't cover it. A failing
# run here is the alert. It never runs on PRs, so a new advisory can't block
# unrelated work.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # minimatch, inside shadcn's CLI, which the site doesn't run. No shadcn
      # release allows the fix.
      - run: bun audit --ignore GHSA-g3hv-75wg-m249
