name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs these checks before publishing an image.
  workflow_call:

# A newer push to a pull request cancels its older run. Every other run (main,
# and calls from the release workflow) gets a group of its own, so it always finishes.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check:lockfile compares bun.lock with the base commit.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: install
        run: bun ci
      # Each step runs even if the one before it fails, so one run lists every failure.
      - run: bun run check:lockfile
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run verify
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build

  docker:
    # A release builds and publishes the image itself, so it skips this build.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Hosted runners are discarded after the job, so teardown is wasted time.
          cleanup: false
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
